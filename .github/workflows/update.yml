name: Update data and deploy

on:
  schedule:
    - cron: "13 9 * * 1" # Mondays 09:13 UTC
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-pull the full history (reconciles amendments)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync to latest main
        # The triggering commit can be behind main (e.g. a data commit landed
        # since); start from the newest store so incremental mode engages.
        run: git pull --ff-only origin main || git reset --hard origin/main

      - name: Pull NSF DMS awards
        # Weekly runs are incremental (trailing months only, merged into the
        # data/awards.csv store). Full reconciliation - which picks up award
        # amendments but never deletes stored history - runs on the first
        # Monday of the month, or on demand via the full_refresh input.
        run: |
          FLAG=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            FLAG="--full"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -le 7 ]; then
            FLAG="--full"
          fi
          echo "mode flag: '$FLAG'"
          python scripts/pull_nsf_dms.py $FLAG
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh NSF DMS award data [skip ci]"
            for i in 1 2 3; do
              git push && break
              # A concurrent run pushed its own data commit; replay ours on
              # top, preferring our freshly generated files on conflict.
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
